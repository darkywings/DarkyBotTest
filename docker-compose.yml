name: twilight-core

services:

  postgres:
    image: postgres:17.6-alpine
    container_name: postgres-database
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_BOT_USER=${DB_USER}
      - POSTGRES_BOT_PASSWORD=${DB_PASSWORD}
      - POSTGRES_BOT_DB=${DB_NAME}
      - BOT_ADMIN_ID=${ADMIN_VK_ID}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./database/data:/var/lib/postgresql/data
      - ./database/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./database/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    restart: on-failure
    networks:
      - twi-network
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    attach: false
    
  darky-bot:
    container_name: darky-bot
    tty: true
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      - COLORTERM=truecolor
      - ACCESS_TOKEN=${BOT_TOKEN}
      - GROUP_ID=${BOT_ID}
      - DB_HOST=postgres-database
      - DB_PORT=${DB_PORT:-5432}
      - POSTGRES_BOT_USER=${DB_USER}
      - POSTGRES_BOT_PASSWORD=${DB_PASSWORD}
      - POSTGRES_BOT_DB=${DB_NAME}
    restart: on-failure
    volumes:
      - ./bot:/app
    networks:
      - twi-network
    attach: true
    depends_on:
      - postgres

networks:
  twi-network:
    attachable: true

volumes:
  postgres_data: {}