name: twilight-core

services:

  postgres:
    image: postgres:17.6-alpine
    container_name: postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_BOT_USER=${DB_USER}
      - POSTGRES_BOT_PASSWORD=${DB_PASSWORD}
      - POSTGRES_BOT_DB=${DB_NAME}
      - BOT_ADMIN_ID=${ADMIN_VK_ID}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./database/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    restart: on-failure
    networks:
      - twi-network
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    attach: false

  pgadmin:
    image: dpage/pgadmin4:9.15.0
    container_name: pgadmin4
    restart: on-failure
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - twi-network
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    attach: false
    
  darky-bot:
    container_name: darky-bot
    tty: true
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      - COLORTERM=truecolor
      - ACCESS_TOKEN=${BOT_TOKEN}
      - GROUP_ID=${BOT_ID}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - POSTGRES_BOT_USER=${DB_USER}
      - POSTGRES_BOT_PASSWORD=${DB_PASSWORD}
      - POSTGRES_BOT_DB=${DB_NAME}
      - WITLESS_HOST=witless-api
    restart: on-failure
    volumes:
      - ./bot:/app
    networks:
      - twi-network
    attach: true
    depends_on:
      - postgres

  witless:
    container_name: witless-api
    build:
      context: ./witless-api
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - "${WITLESS_PORT:-8010}:8000"
    volumes:
      - witless_data:/app/messages
    networks:
      - twi-network
    attach: false

networks:
  twi-network:
    attachable: true

volumes:
  darkybot_data: {}
  postgres_data: {}
  pgadmin_data: {}
  witless_data: {}